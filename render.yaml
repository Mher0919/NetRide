# NetRide Render Blueprint
#
# One backend API service plus the two web dashboards:
#   1. netride-backend        — Node/TypeScript API
#   2. netride-partner-portal — sponsor + partner + fleet dashboards
#   3. netride-admin-dashboard
#
# Usage:
#   1. Render dashboard -> New -> Blueprint -> connect this repo.
#   2. Render reads this file and creates the services.
#   3. Fill in the secret env vars marked sync:false in the Environment tab.

services:
  # --------------------------------------------------------------------------
  # Backend API
  # --------------------------------------------------------------------------
  - type: web
    name: netride-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: backend
    plan: standard
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # ---- Secrets you MUST set in the dashboard (sync: false) ----
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: IOS_APP_STORE_URL
        sync: false
      - key: ANDROID_PLAY_STORE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROADS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # Unified Partner Portal (sponsor + partner + fleet dashboards)
  # --------------------------------------------------------------------------
  - type: web
    name: netride-partner-portal
    runtime: node
    rootDir: apps/sponsor_portal
    plan: free
    healthCheckPath: /
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # API the portal talks to (the backend service).
      - key: VITE_API_URL
        value: "https://netride.onrender.com"

  # --------------------------------------------------------------------------
  # Admin Dashboard
  # --------------------------------------------------------------------------
  - type: web
    name: netride-admin-dashboard
    runtime: node
    rootDir: apps/admin_dashboard
    plan: free
    healthCheckPath: /
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VITE_API_URL
        value: "https://netride.onrender.com"
