# NetRide Render Blueprint
#
# Deploys the backend (Node/TypeScript) with in-process face verification
# (face-api.js / TensorFlow.js). No separate Python service is required.
#
# Usage:
#   1. Render dashboard -> New -> Blueprint -> connect this repo.
#   2. Render reads this file and creates the service.
#   3. Fill in the secret env vars marked sync:false in the Environment tab.
#   4. On first face check the model weights are downloaded automatically
#      into the service (or pre-bake them — see README).

services:
  - type: web
    name: netride-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: backend
    plan: standard # TF.js + face-api.js need real CPU/RAM; free tier will OOM
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # ---- Secrets you MUST set in the dashboard (sync: false) ----
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      # ---- Face verification tunables (defaults from .env.example) ----
      - key: FACE_MATCH_THRESHOLD
        value: "0.45"
      - key: FACE_CHECK_INTERVAL_HOURS
        value: "12"
      - key: FACE_LOCATION_JUMP_MILES
        value: "5"
