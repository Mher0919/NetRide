upstream osrm_cluster {
    least_conn;
    server osrm-1:5000 max_fails=3 fail_timeout=10s;
    server osrm-2:5000 max_fails=3 fail_timeout=10s;
    server osrm-3:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 5000;

    location / {
        proxy_pass http://osrm_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
