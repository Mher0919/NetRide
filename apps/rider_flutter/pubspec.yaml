name: rider_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  socket_io_client: 3.1.4
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  dio: ^5.9.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  app_links: ^6.3.3
  cached_network_image: ^3.4.1
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logo-noBackground.png
    - assets/sounds/order_accepted.mp3
    - assets/sounds/order_cancelled.mp3
    - assets/sounds/trip_completed.mp3
    - assets/sounds/tip_received.mp3