name: rider_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  package_info_plus: ^10.2.2
  in_app_update: ^4.2.5
  socket_io_client: 3.1.4
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  dio: ^5.9.2
  image_picker: ^1.2.4
  intl: ^0.19.0
  shared_preferences: ^2.5.6
  # Platform-backed secure storage (Android Keystore / iOS Keychain) for
  # session credentials. Tokens are never persisted in plain preferences.
  flutter_secure_storage: ^11.2.0
  google_fonts: ^6.3.3
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.3
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  audioplayers: ^6.7.1
  confetti: ^0.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Real phone push notifications (FCM + local rendering + device registry).
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2

  # Stripe PaymentSheet — secure in-app card entry (rider payment methods).
  # Card numbers/CVCs are collected by Stripe's SDK; NetRide only ever sees
  # the brand/last4/expiry from its own backend.
  flutter_stripe: ^14.1.0
  flutter_contacts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logo-noBackground.png
    - assets/images/car-logo.png
    - assets/sounds/order_accepted.mp3
    - assets/sounds/order_cancelled.mp3
    - assets/sounds/trip_completed.mp3
    - assets/sounds/tip_received.mp3