name: driver_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  socket_io_client: 3.1.4
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  dio: ^5.9.2
  image_picker: ^1.2.4
  intl: ^0.19.0
  shared_preferences: ^2.5.6
  # Platform-backed secure storage (Android Keystore / iOS Keychain) for
  # session credentials. Tokens are never persisted in plain preferences.
  flutter_secure_storage: ^11.2.0
  google_fonts: ^6.3.3
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.3
  app_links: ^7.0.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  audioplayers: ^6.7.1
  flutter_tts: ^4.2.5
  confetti: ^0.8.0

  # Real phone push notifications (FCM + local rendering + device registry).
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2

  # Stripe Connect onboarding opened INSIDE the app (Stripe-hosted account
  # onboarding page in an in-app web view). NetRide never collects bank or
  # payout-card details from drivers.
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logo-noBackground.png
    - assets/sounds/countdown_tick.wav
    - assets/sounds/incoming_request.wav
    - assets/sounds/online.wav
    - assets/sounds/offline.wav
    - assets/sounds/order_accepted.mp3
    - assets/sounds/order_cancelled.mp3
    - assets/sounds/trip_completed.mp3
    - assets/sounds/tip_received.mp3