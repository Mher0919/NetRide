# docker-compose.yml
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ridehail
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - '6432:6432'
    environment:
      DB_USER: ridehail
      DB_PASSWORD: secret
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ridehail
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 1000
    depends_on:
      - postgres

  backend:
    build: ./backend
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ridehail:secret@postgres:5432/ridehail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-32-char-secret-replace-in-prod
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_URL: https://api.openrouteservice.org/v2/directions
      ORS_PROFILE: driving-car
      ORS_TIMEOUT_MS: 2000
      ORS_MAX_RETRIES: 2
      DRIVER_MATCH_RADIUS_KM: 5
      DRIVER_ACCEPT_TIMEOUT_MS: 15000
      FACE_SERVICE_URL: http://face-service:8000
      FACE_CHECK_INTERVAL_HOURS: 12
      FACE_LOCATION_JUMP_MILES: 5
      LOAD_TEST: 'false'
      LEGACY_RATE_LIMIT: 'false'
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      - postgres
      - redis
      - face-service
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads

  match-worker:
    build: ./backend
    command: npm run match-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ridehail:secret@postgres:5432/ridehail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-32-char-secret-replace-in-prod
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_URL: https://api.openrouteservice.org/v2/directions
      ORS_PROFILE: driving-car
      ORS_TIMEOUT_MS: 2000
      ORS_MAX_RETRIES: 2
      DRIVER_MATCH_RADIUS_KM: 5
      DRIVER_ACCEPT_TIMEOUT_MS: 15000
      MATCH_WORKER_CONCURRENCY: 4
      DISPATCH_FANOUT_SIZE: 5
    depends_on:
      - postgres
      - redis
    profiles:
      - scaled
    volumes:
      - ./backend:/app
      - /app/node_modules

  cron-worker:
    build: ./backend
    command: npm run cron-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ridehail:secret@postgres:5432/ridehail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-32-char-secret-replace-in-prod
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_URL: https://api.openrouteservice.org/v2/directions
      ORS_PROFILE: driving-car
      ORS_TIMEOUT_MS: 2000
      ORS_MAX_RETRIES: 2
      DRIVER_SCORE_CACHE_TTL_S: 300
    depends_on:
      - postgres
      - redis
    profiles:
      - scaled
    volumes:
      - ./backend:/app
      - /app/node_modules

  face-service:
    build: ./backend/face_service
    container_name: face-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      FACE_MATCH_THRESHOLD: 0.45
      FACE_MIN_MOTION_PX: 15
      FACE_MIN_BLINK_COUNT: 1
      FACE_MIN_LAPLACIAN_VAR: 80
      FACE_MIN_AREA_RATIO: 0.04
      FACE_MAX_AREA_RATIO: 0.60
      FACE_MIN_BRIGHTNESS: 40
      FACE_MAX_BRIGHTNESS: 230
      FACE_MIN_LBP_VARIANCE: 3.0
      FACE_MAX_MULTIPLE_FACES: 1
      FACE_LIVENESS_CONFIDENCE: 0.5

volumes:
  pg_data:
  redis_data:
