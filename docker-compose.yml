services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ridehail
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - '6432:6432'
    environment:
      DB_USER: ridehail
      DB_PASSWORD: secret
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ridehail
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 1000
    depends_on:
      - postgres

  backend:
    build: ./backend
    command: npm run dev
    ports:
      - '3000:3000'
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ridehail:secret@postgres:5432/ridehail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-32-char-secret-replace-in-prod
      DRIVER_MATCH_RADIUS_KM: 5
      DRIVER_ACCEPT_TIMEOUT_MS: 15000
      LOAD_TEST: 'false'
      LEGACY_RATE_LIMIT: 'false'
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads

  match-worker:
    build: ./backend
    command: npm run match-worker
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ridehail:secret@postgres:5432/ridehail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-32-char-secret-replace-in-prod
      DRIVER_MATCH_RADIUS_KM: 5
      DRIVER_ACCEPT_TIMEOUT_MS: 15000
      MATCH_WORKER_CONCURRENCY: 4
      DISPATCH_FANOUT_SIZE: 5
    depends_on:
      - postgres
      - redis
    profiles:
      - scaled
    volumes:
      - ./backend:/app
      - /app/node_modules

  cron-worker:
    build: ./backend
    command: npm run cron-worker
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ridehail:secret@postgres:5432/ridehail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-32-char-secret-replace-in-prod
      DRIVER_SCORE_CACHE_TTL_S: 300
    depends_on:
      - postgres
      - redis
    profiles:
      - scaled
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pg_data:
  redis_data:
